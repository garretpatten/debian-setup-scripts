name: 'Test Runner'

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test-cli:
    name: 'CLI-only install'
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    timeout-minutes: 60

    steps:
      - name: Prepare container
        run: |
          apt_components='main contrib non-free non-free-firmware'
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg lsb-release sudo
          if [[ -f /etc/apt/sources.list ]]; then
            sed -i "s/ main\$/ ${apt_components}/" /etc/apt/sources.list
          fi
          for sources_file in /etc/apt/sources.list.d/*.sources; do
            [[ -f "$sources_file" ]] || continue
            sed -i "s/^Components: main\$/Components: ${apt_components}/" \
              "$sources_file"
          done
          apt-get update
          useradd -m -s /bin/bash ci
          echo 'ci ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/ci
          chmod 440 /etc/sudoers.d/ci

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +
          chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Run CLI-only install
        run: |
          su - ci -c \
            "cd '${GITHUB_WORKSPACE}/src/scripts' && bash run-install.sh cli"

      - name: Validate CLI installs
        run: |
          su - ci -c \
            "cd '$GITHUB_WORKSPACE' && ./scripts/validate-installs-cli.sh"

  test-config:
    name: 'Configuration run'
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    timeout-minutes: 30

    steps:
      - name: Prepare container
        run: |
          apt_components='main contrib non-free non-free-firmware'
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg lsb-release sudo
          if [[ -f /etc/apt/sources.list ]]; then
            sed -i "s/ main\$/ ${apt_components}/" /etc/apt/sources.list
          fi
          for sources_file in /etc/apt/sources.list.d/*.sources; do
            [[ -f "$sources_file" ]] || continue
            sed -i "s/^Components: main\$/Components: ${apt_components}/" \
              "$sources_file"
          done
          apt-get update
          useradd -m -s /bin/bash ci
          echo 'ci ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/ci
          chmod 440 /etc/sudoers.d/ci

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +
          chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Run configuration
        run: |
          su - ci -c \
            "cd '${GITHUB_WORKSPACE}/src/scripts' && bash run-config.sh"

      - name: Validate config-only outcomes
        run: |
          su - ci -c \
            "cd '$GITHUB_WORKSPACE' && ./scripts/validate-config-only.sh"

  test-full:
    name: 'Full install'
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    timeout-minutes: 60

    steps:
      - name: Prepare container
        run: |
          apt_components='main contrib non-free non-free-firmware'
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg lsb-release sudo
          if [[ -f /etc/apt/sources.list ]]; then
            sed -i "s/ main\$/ ${apt_components}/" /etc/apt/sources.list
          fi
          for sources_file in /etc/apt/sources.list.d/*.sources; do
            [[ -f "$sources_file" ]] || continue
            sed -i "s/^Components: main\$/Components: ${apt_components}/" \
              "$sources_file"
          done
          apt-get update
          useradd -m -s /bin/bash ci
          echo 'ci ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/ci
          chmod 440 /etc/sudoers.d/ci

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +
          chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Run full install
        run: |
          su - ci -c \
            "cd '${GITHUB_WORKSPACE}/src/scripts' && bash run-install.sh all"

      - name: Validate full installs
        run: |
          su - ci -c \
            "cd '$GITHUB_WORKSPACE' && ./scripts/validate-installs.sh"

  test-master:
    name: 'Master (install + config)'
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    timeout-minutes: 60

    steps:
      - name: Prepare container
        run: |
          apt_components='main contrib non-free non-free-firmware'
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg lsb-release sudo
          if [[ -f /etc/apt/sources.list ]]; then
            sed -i "s/ main\$/ ${apt_components}/" /etc/apt/sources.list
          fi
          for sources_file in /etc/apt/sources.list.d/*.sources; do
            [[ -f "$sources_file" ]] || continue
            sed -i "s/^Components: main\$/Components: ${apt_components}/" \
              "$sources_file"
          done
          apt-get update
          useradd -m -s /bin/bash ci
          echo 'ci ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/ci
          chmod 440 /etc/sudoers.d/ci

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +
          chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Run setup scripts
        run: |
          su - ci -c \
            "cd '${GITHUB_WORKSPACE}/src/scripts' && bash master.sh"

      - name: Validate installs and config
        run: |
          su - ci -c \
            "cd '$GITHUB_WORKSPACE' && ./scripts/validate.sh"
