---
name: 'Quality Checks'

on: [pull_request]

jobs:
  quality-checks:
    name: 'Linters'
    # yamllint disable-line rule:line-length
    uses: garretpatten/quality-checks/.github/workflows/quality-checks.yaml@f0c4ccbc6c78649ac60b2d18ffb02c59b11c3e03
    # reusable workflow: garretpatten/quality-checks master HEAD
    with:
      eslint_run: true
      hadolint_run: true
      jq_run: true
      markdownlint_run: true
      prettier_run: true
      ruff_run: true
      shellcheck_run: true
      taplo_run: true
      yamllint_run: true
    secrets: inherit
